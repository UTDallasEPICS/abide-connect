<!doctype html>
<!--
  Bundled into the native app and shown only when the WebView can't load the
  site (see `server.errorPath` in capacitor.config.ts). Everything is inline:
  there is no server to fetch a stylesheet from by definition.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abide Connect</title>
  <script src="server-url.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      p { color: #9ca3af; }
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #4b5563; line-height: 1.5; }
    button {
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #00786f;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Abide Connect</h1>
    <p>Check your internet connection and try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      window.location.replace(window.ABIDE_SERVER_URL || '/')
    })
  </script>
</body>
</html>
